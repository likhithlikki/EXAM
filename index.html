<!-- ===== PWA: installable, standalone, works offline =====

     "Install app" / "Add to Home Screen" and open with no address bar,
     like a normal app instead of a website. The service worker that
     makes it actually WORK offline is registered from app.js. -->
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- PERFORMANCE FIX (Lighthouse: render-blocking requests, ~2650ms estimated
     savings): the Google Fonts stylesheet was a plain blocking <link
     rel="stylesheet">, so the browser couldn't paint anything until it
     fetched and parsed that CSS. This is the standard non-blocking pattern:
     fetch it with low priority via rel="preload", then swap it to an active
     stylesheet once loaded; the <noscript> tag keeps fonts working exactly
     as before for the (rare) no-JS case. Same fonts, same weights, same
     display=swap behavior — only the loading priority changed. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>

<link rel="stylesheet" href="style.css">
