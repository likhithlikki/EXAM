name: Sync content from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export from Google Sheets
        env:
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node tools/sync-from-sheets.js

      - name: Commit changes (only if data changed)
        run: |
          git config user.name "sheets-sync[bot]"
          git config user.email "sheets-sync@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Sync content from Google Sheets"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
